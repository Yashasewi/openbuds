name: Checks

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        working-directory: native
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: swift build -c release --product OpenBuds

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile

      - parallel:
          - name: Format
            working-directory: app
            run: pnpm exec vp fmt --check src index.html

          - name: Lint
            working-directory: app
            run: pnpm exec vp lint --deny-warnings

          - name: Build
            working-directory: app
            run: pnpm run build
